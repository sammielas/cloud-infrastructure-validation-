name: Pull Request Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Infrastructure Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Checkov in isolated environment
        run: |
          python -m venv .venv-checkov
          .venv-checkov/bin/python -m pip install \
            --only-binary=:all: \
            -r requirements-security.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6
        with:
          tflint_version_file: .tflint-version
          cache: true

      - name: Initialize TFLint
        run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install quality and test dependencies
        run: |
          python -m pip install \
            --only-binary=:all: \
            -r requirements-test.txt

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Terraform init
        working-directory: infrastructure
        run: terraform init -backend=false

      - name: Terraform formatting
        working-directory: infrastructure
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infrastructure
        run: terraform validate

      - name: Terraform lint
        run: bash scripts/run-tflint.sh

      - name: Terraform security scan
        run: bash scripts/run-checkov.sh

      - name: Offline security regression tests
        run: |
          python -m pytest \
            tests/security/test_checkov_public_access.py \
            tests/security/test_cleanup.py \
            -v

  integration:
    name: S3 Integration Tests
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-2
      FLOCI_S3_ENDPOINT: http://127.0.0.1:4566
      TEST_S3_BUCKET: platform-artifacts-local-dev
      TF_VAR_s3_endpoint: http://127.0.0.1:4566

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      - name: Start Floci
        run: |
          docker run -d \
            --name floci \
            -p 127.0.0.1:4566:4566 \
            floci/floci@sha256:b3b3a70a294b8ba8095385b8571ea1e4d44d494950d98de5e812cd9de02f506b

      - name: Wait for Floci S3 API
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if aws \
              --endpoint-url="$FLOCI_S3_ENDPOINT" \
              s3api list-buckets \
              --output json > /dev/null 2>&1; then
              echo "Floci S3 API ready after $attempt attempt(s)"
              exit 0
            fi

            echo "Waiting for Floci S3 API ($attempt/30)"
            sleep 2
          done

          echo "Floci failed readiness check"
          docker logs floci
          exit 1

      - name: Install Python test dependencies
        run: |
          python -m pip install \
            --only-binary=:all: \
            -r requirements-test.txt

      - name: Initialize Terraform
        working-directory: infrastructure
        run: terraform init -backend=false

      - name: Run Terraform native tests
        working-directory: infrastructure
        run: terraform test -no-color

      - name: Reject invalid environment
        run: bash scripts/test-invalid-environment.sh

      - name: Terraform plan
        working-directory: infrastructure
        run: |
          terraform plan \
            -input=false \
            -out=tfplan \
            -var="environment=dev"

      - name: Apply infrastructure
        working-directory: infrastructure
        run: terraform apply -input=false -auto-approve tfplan

      - name: Run Python integration tests
        run: python -m pytest tests/integration -v

      - name: Capture Floci logs on failure
        if: failure()
        run: docker logs floci || true

      - name: Destroy infrastructure
        if: always()
        working-directory: infrastructure
        shell: bash
        run: |
          if [ -f terraform.tfstate ] && [ -d .terraform ]; then
            terraform destroy \
              -input=false \
              -auto-approve \
              -var="environment=dev"
          else
            echo "No initialized Terraform state available for cleanup."
          fi

      - name: Verify Terraform cleanup
        if: always()
        working-directory: infrastructure
        shell: bash
        run: |
          if [ -f terraform.tfstate ] && [ -d .terraform ]; then
            remaining=$(terraform state list)

            if [ -n "$remaining" ]; then
              echo "Terraform still tracks resources:"
              echo "$remaining"
              exit 1
            fi

            echo "Terraform state contains no managed resources."
          fi

      - name: Stop emulator
        if: always()
        run: docker rm -f floci || true

  iam-security:
    name: IAM Security Validation
    runs-on: ubuntu-latest

    env:
      AWS_DEFAULT_REGION: eu-west-2
      FLOCI_ENDPOINT: http://127.0.0.1:4567
      FLOCI_ADMIN_ACCESS_KEY: floci
      FLOCI_ADMIN_SECRET_KEY: floci

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install \
            --only-binary=:all: \
            -r requirements-test.txt

      - name: Start security-enabled Floci
        run: |
          docker run -d \
            --name floci-security \
            -p 127.0.0.1:4567:4566 \
            -e FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED=true \
            -e FLOCI_SERVICES_S3_ENFORCE_AUTH=true \
            -e FLOCI_SERVICES_IAM_SEED_DEPLOYER_PRINCIPAL=true \
            floci/floci@sha256:b3b3a70a294b8ba8095385b8571ea1e4d44d494950d98de5e812cd9de02f506b

      - name: Wait for security emulator readiness
        id: readiness
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if python - <<'PY'
          import os
          import sys

          import boto3
          from botocore.exceptions import BotoCoreError, ClientError

          client = boto3.client(
              "iam",
              endpoint_url=os.environ["FLOCI_ENDPOINT"],
              region_name=os.environ["AWS_DEFAULT_REGION"],
              aws_access_key_id=os.environ["FLOCI_ADMIN_ACCESS_KEY"],
              aws_secret_access_key=os.environ["FLOCI_ADMIN_SECRET_KEY"],
              config=boto3.session.Config(
                  connect_timeout=2,
                  read_timeout=2,
                  retries={"max_attempts": 1},
              ),
          )

          try:
              response = client.get_user(UserName="floci-deployer")
              assert response["User"]["UserName"] == "floci-deployer"
          except (BotoCoreError, ClientError, AssertionError):
              sys.exit(1)
          PY
            then
              echo "Security emulator ready after $attempt attempt(s)"
              exit 0
            fi

            echo "Waiting for IAM API ($attempt/30)"
            sleep 2
          done

          echo "Security emulator failed readiness check"
          exit 1

      - name: Run IAM enforcement tests
        id: iam_tests
        run: |
          python -m pytest \
            tests/security/test_floci_iam_enforcement.py \
            -v

      - name: Publish security validation summary
        if: always()
        shell: bash
        env:
          READINESS_RESULT: ${{ steps.readiness.outcome }}
          IAM_TEST_RESULT: ${{ steps.iam_tests.outcome }}
        run: |
          {
            echo "## Pull Request Security Validation"
            echo
            echo "| Control | Status |"
            echo "|---|---|"

            if [[ "$READINESS_RESULT" == "success" &&
                  "$IAM_TEST_RESULT" == "success" ]]; then
              echo "| Floci IAM enforcement | PASS |"
            else
              echo "| Floci IAM enforcement | FAILED / NOT COMPLETED |"
            fi

            echo "| AWS Organizations SCP enforcement | NOT VALIDATED |"
            echo "| Real AWS IAM validation | NOT VALIDATED |"
            echo "| AWS Config compliance | NOT VALIDATED |"
            echo
            echo "### Validation boundary"
            echo
            echo "Floci results demonstrate selected emulator IAM behaviours."
            echo "They do not establish real AWS or SCP enforcement."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture security emulator logs on failure
        if: failure()
        run: docker logs floci-security || true

      - name: Stop security emulator
        if: always()
        shell: bash
        run: |
          if docker container inspect floci-security > /dev/null 2>&1; then
            docker rm -f floci-security
          fi
