repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform formatting
        entry: terraform fmt -check -recursive infrastructure
        language: system
        pass_filenames: false
        files: \.tf$

      - id: terraform-tflint
        name: Terraform linting
        entry: bash scripts/run-tflint.sh
        language: system
        pass_filenames: false
        files: (\.tf$|(^|/)\.tflint\.hcl$|^\.tflint-version$|^scripts/run-tflint\.sh$)


      - id: terraform-checkov
        name: Terraform security scanning
        entry: bash scripts/run-checkov.sh
        language: system
        pass_filenames: false
        files: (\.tf$|^scripts/run-checkov\.sh$|^requirements-security\.txt$)
